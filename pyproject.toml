[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiewon-ot"
version = "0.1.0"
description = "Live NFL regulation simulation for probability of overtime (P(OT))."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Ramis B." }
]
keywords = ["NFL", "overtime", "simulation", "win probability", "sports analytics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.7",
  "scikit-learn>=1.3",
  "scipy>=1.10"
]

[project.optional-dependencies]
extras = [
  "xgboost>=2.0",
  "lightgbm>=4.0"
]

[project.scripts]
tiewon-ot = "tiewon_ot.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["tiewon_ot*"]
exclude = ["tests*"]
